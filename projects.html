---
layout: page
title: projects
---
<div class="page-content wc-container">
    <div class="post">
        <h1>Projects</h1>
        <ul>
            {% for projects in site.projects %}
            <li>
                <div class="post-time">
                    <i class="fa fa-calendar"></i>
                    <time>{{ projects.date | date: "%d-%m-%Y" }}</time>
                    <a href="{{ projects.url | prepend: site.url }}">{{ projects.title }}</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
