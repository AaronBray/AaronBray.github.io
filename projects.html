---
layout: page
title: Pojects
---
<div class="page-content wc-container">
    <div class="post">
        <h1>Projects</h1>
        <ul>
            {% for post in site.projectfiles %}
            <li>
                <div class="post-time">
                    <i class="fa fa-calendar"></i>
                    <time>{{ post.date | date: "%d-%m-%Y" }}</time>
                    <a href="{{ site.url | prepend: site.url }}">{{ post.title }}</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
